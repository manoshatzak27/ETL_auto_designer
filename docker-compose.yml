# ──────────────────────────────────────────────────────────────────────────
# Standalone Postgres holding the Athena OMOP vocabulary, filtered down to
# standard + valid concepts only. See README.md for the load procedure.
#
# Note: this is a separate stack from ../ETL_auto_designer (which runs its
# own unfiltered "omop-postgres" on host port 5432) — different container
# name, volume name, and default host port (5433) so both can run at once.
# ──────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: vocab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocab_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-athena_vocab}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    shm_size: "1gb"
    volumes:
      - vocab_pgdata:/var/lib/postgresql/data
      # Needed for server-side COPY in 02_load_staging.sql. The SQL scripts
      # themselves are NOT mounted: load_vocab.sh / setup_pipeline.sh pipe them
      # in over stdin, so an edit on the host always takes effect immediately
      # (a bind mount can serve a stale copy after a file is rewritten).
      - ./athena_ALL:/athena_source:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocab} -d ${POSTGRES_DB:-athena_vocab}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The matching pipeline. Run through ./pipeline.sh, which is a wrapper for
  # `docker compose run --rm pipeline ...`.
  #
  # It sits behind a profile on purpose: it is a one-shot command, not a
  # daemon, so a plain `docker compose up -d` (which load_vocab.sh and
  # setup_pipeline.sh both do) must not try to start it. `compose run` enables
  # the profile of the service it is given, so the wrapper needs no --profile.
  pipeline:
    profiles: ["cli"]
    build:
      context: .
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-1}
    image: vocab-pipeline:latest
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Container-internal address. POSTGRES_PORT in .env is the *host* port
      # (5433) and does not apply on this side of the network, so both are set
      # explicitly rather than inherited.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-vocab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocab_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-athena_vocab}
      # Config overrides go in data/pipeline.json (copy pipeline.example.json).
      # config.py tolerates the file being absent.
      PIPELINE_CONFIG: /app/data/pipeline.json
    working_dir: /app
    volumes:
      # Source is mounted read-only over the copy in the image so that editing
      # a stopword list or a threshold takes effect on the next run without a
      # rebuild. The image still carries its own copy, so `docker run
      # vocab-pipeline` works standalone with no bind mounts at all.
      - ./pipeline:/app/pipeline:ro
      - ./tests:/app/tests:ro
      # Writable: the benchmark scripts emit CSVs next to their gold sets.
      - ./benchmarks:/app/benchmarks
      # Where input columns and output mappings live, on both sides.
      - ./data:/app/data
      # ~90MB for the default MiniLM, downloaded once instead of per run.
      - hf_cache:/cache/huggingface

volumes:
  vocab_pgdata:
    name: new_concept_finding_vocab_pgdata
  hf_cache:
    name: new_concept_finding_hf_cache
