# ──────────────────────────────────────────────────────────────────────────────
# OMOP ETL Auto-Designer — full development stack.
#
#   docker compose up --build
#
# Services:
#   postgres       Stores the OMOP CDM v5.4 data and (optionally) vocabulary.
#   omop-init      One-shot. Applies DDL + primary keys on first run.
#   entitylinker   SapBERT + FAISS concept-search service used by Step 9.
#   conceptmatcher The staged OMOP matching pipeline behind HTTP; the Concepts
#                  step's "Load concepts" button maps every variable through it.
#   backend        FastAPI server (port 8000), with hot reload.
#   frontend       Vite dev server (port 5173), with HMR.
#
# Wizard state (SQLite) stays inside the backend container under /app/etl_designer.db.
# Postgres is used only for the final OMOP data load.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: omop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omop_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-omop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omop} -d ${POSTGRES_DB:-omop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  omop-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omop-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-omop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-omop_pwd}
      PGDATABASE: ${POSTGRES_DB:-omop}
      OMOP_DB_HOST: postgres
      OMOP_DB_PORT: 5432
      OMOP_DB_NAME: ${POSTGRES_DB:-omop}
      OMOP_DB_USER: ${POSTGRES_USER:-omop}
      OMOP_DB_PASSWORD: ${POSTGRES_PASSWORD:-omop_pwd}
      OMOP_DEFAULT_SCHEMA: ${OMOP_SCHEMA:-cdm}
      OMOP_VOCAB_SCHEMA: ${OMOP_VOCAB_SCHEMA:-vocab}
    volumes:
      - ./backend:/app
      - ./scripts/init-omop.sh:/init-omop.sh:ro
    entrypoint: ["/bin/sh", "/init-omop.sh"]

  entitylinker:
    build:
      context: ./entitylinker
      dockerfile: dockerfile
    container_name: omop-entitylinker
    restart: unless-stopped
    environment:
      ENTITYLINKER_CONFIG: /app/config.yaml
      EL_API_HOST: 0.0.0.0
      EL_API_PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./entitylinker/config.container.yaml:/app/config.yaml:ro
      - ${ATHENA_BUNDLE_PATH:-./vocab_bundle}:/data
    ports:
      - "${ENTITYLINKER_PORT:-8001}:8000"
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # ────────────────────────────────────────────────────────────────────────
  # The multi-stage concept matcher from the sibling "new concept finding"
  # project, run as `serve` (pipeline/service.py) instead of as a one-shot CLI.
  #
  # It needs that project's *own* Postgres — the standard-only Athena vocabulary
  # plus the `pipeline` schema — which is a separate ~9GB stack on host port
  # 5433, loaded there with ./load_vocab.sh and ./setup_pipeline.sh. Rather than
  # duplicate it, this container reaches the already-running one back through the
  # host gateway, so both stacks stay independently startable. Point
  # VOCAB_DB_HOST/PORT elsewhere in .env if that database lives on another host.
  #
  # Build context is the sibling checkout. `image:` names the same tag that
  # project's own compose builds, so whichever stack builds it first, the other
  # reuses it instead of building ~2GB of CPU torch twice.
  conceptmatcher:
    build:
      context: ${CONCEPT_PIPELINE_PATH:-../new concept finding}
      args:
        WITH_EMBEDDINGS: ${CONCEPT_MATCHER_EMBEDDINGS:-1}
    image: vocab-pipeline:latest
    container_name: omop-conceptmatcher
    restart: unless-stopped
    command: ["serve"]
    environment:
      # Container-internal listen address, not the published host port below.
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8000
      POSTGRES_HOST: ${VOCAB_DB_HOST:-host.docker.internal}
      POSTGRES_PORT: ${VOCAB_DB_PORT:-5433}
      POSTGRES_DB: ${VOCAB_DB_NAME:-athena_vocab}
      POSTGRES_USER: ${VOCAB_DB_USER:-vocab}
      POSTGRES_PASSWORD: ${VOCAB_DB_PASSWORD:-vocab_pwd}
      # Tuning overrides live in that project's data/pipeline.json (copied from
      # its pipeline.example.json). config.py tolerates the file being absent.
      PIPELINE_CONFIG: /app/data/pipeline.json
    extra_hosts:
      # Linux has no built-in host.docker.internal; without this the vocabulary
      # database on the host's port 5433 is unreachable from in here.
      - "host.docker.internal:host-gateway"
    volumes:
      # The pipeline source, mounted read-only over the image's own copy —
      # exactly what that project's compose does for its `pipeline` service, and
      # for the same reason: a changed threshold, stopword list or scoring stage
      # takes effect without rebuilding ~2GB of image. Without this the service
      # runs whatever was baked in whenever the image was last built, which is
      # silently stale the moment the matcher is worked on.
      #
      # Note the difference from that project's CLI: this one is a long-running
      # process, so an edit needs `docker compose restart conceptmatcher` to be
      # picked up, not just the next invocation. Dependency changes
      # (requirements.txt) still need a rebuild.
      - ${CONCEPT_PIPELINE_PATH:-../new concept finding}/pipeline:/app/pipeline:ro
      - ${CONCEPT_PIPELINE_PATH:-../new concept finding}/data:/app/data:ro
      # ~90MB for the default MiniLM, downloaded once rather than on every
      # container recreate. Same role as the sibling stack's hf_cache volume.
      - conceptmatcher_hf_cache:/cache/huggingface
    ports:
      - "${CONCEPT_MATCHER_PORT:-8002}:8000"
    healthcheck:
      # /health reports on the built matcher — the connection pool, the IDF index
      # and the embedding model. The service warms all three up in the background
      # at startup, but a probe that arrives mid-warmup blocks behind it, so both
      # the timeout and the start period allow for a model load.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      omop-init:
        condition: service_completed_successfully
      entitylinker:
        condition: service_started
      conceptmatcher:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ENTITYLINKER_URL: http://entitylinker:8000/api/conceptlink
      CONCEPT_MATCHER_URL: http://conceptmatcher:8000
      OMOP_DB_HOST: postgres
      OMOP_DB_PORT: 5432
      OMOP_DB_NAME: ${POSTGRES_DB:-omop}
      OMOP_DB_USER: ${POSTGRES_USER:-omop}
      OMOP_DB_PASSWORD: ${POSTGRES_PASSWORD:-omop_pwd}
      OMOP_DEFAULT_SCHEMA: ${OMOP_SCHEMA:-cdm}
      OMOP_VOCAB_SCHEMA: ${OMOP_VOCAB_SCHEMA:-vocab}
      ATHENA_BUNDLE_ROOT: /vocab
      DATABASE_URL: sqlite:////app/etl_designer.db
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - ${ATHENA_BUNDLE_PATH:-./vocab_bundle}:/vocab:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:8000
      # Force Vite to poll the bind-mounted filesystem. Native inotify events
      # don't propagate from a Windows host into a Linux container, nor through
      # Docker Desktop's VirtioFS on Linux, so without this Vite never learns a
      # file changed and keeps serving the transform it cached at startup —
      # host-side edits appear to do nothing until the container is restarted.
      #
      # These are read by frontend/vite.config.ts, which passes them to
      # server.watch. They used to work on their own, when Vite watched through
      # chokidar and chokidar read them from the environment; Vite's own watcher
      # does not, so the names are kept but the wiring is explicit now.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  uploads_data:
  outputs_data:
  conceptmatcher_hf_cache:
